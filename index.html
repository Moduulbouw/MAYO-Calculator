<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYO Ligbox Calculator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --primary: #1a5f9e;
  --primary-hover: #144a7a;
  --success: #27ae60;
  --success-hover: #1e8449;
  --error: #e74c3c;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #2c3e50;
  --border: #dfe6e9;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; }
.container { max-width: 900px; margin: 0 auto; }
.logo { display: block; max-width: 160px; margin: 0 auto 12px; }
.product-hero { display: block; width: 100%; max-width: 520px; margin: 12px auto 16px; border-radius: 10px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.product-hero img { width: 100%; height: auto; display: block; border-radius: 10px; }
h1 { text-align: center; font-size: 1.6rem; margin-bottom: 12px; color: var(--primary); }
.lang-bar { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
.lang-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: #eee; cursor: pointer; font-weight: 600; }
.lang-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; justify-content: center; }
.btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: var(--success-hover); }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: #f0f0f0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; border-bottom: 2px solid var(--border); }
.tab { padding: 8px 14px; background: #e8ecef; border-radius: 6px 6px 0 0; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
.tab.active { background: var(--card); font-weight: 700; border: 1px solid var(--border); border-bottom: 2px solid var(--card); margin-bottom: -2px; }
.tab .remove { color: var(--error); font-weight: bold; cursor: pointer; }
.card { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
.form-grid { display: grid; gap: 14px; }
@media (min-width: 640px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .full { grid-column: 1 / -1; }
}
label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
input.invalid { border-color: var(--error); background: #fff5f5; }
.hint { font-size: 0.8rem; color: #7f8c8d; margin-top: 2px; }
.result { background: #eef6fb; border-radius: 8px; padding: 16px; margin-top: 12px; margin-bottom: 8px; }
.result h3 { margin-bottom: 8px; color: var(--primary); }
.parts { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 8px; }
.parts li { font-size: 0.9rem; }
.advice { color: var(--error); font-weight: 600; margin: 8px 0; }
.suggestion { color: #16a085; font-style: italic; margin: 6px 0; }
.formula { font-size: 0.8rem; color: #636e72; background: #f8f9fa; padding: 8px; border-radius: 4px; margin-top: 10px; }
.diagram { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 12px 0; overflow-x: auto; }
.diagram svg { display: block; margin: 0 auto; height: auto; }
.contact-grid { display: grid; gap: 12px; }
@media (min-width: 500px) { .contact-grid { grid-template-columns: 1fr 1fr; } }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.sub-options { margin-left: 28px; margin-top: 6px; display: none; flex-direction: column; gap: 6px; }
.sub-options.show { display: flex; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2c3e50; color: #fff; padding: 10px 20px; border-radius: 6px; z-index: 100; display: none; }
.toast.show { display: block; }
@media print {
  .lang-bar, .toolbar, .tabs, .tabs-row, .actions, .btn, .product-hero { display: none !important; }
  .card { box-shadow: none; border: 1px solid #ccc; }
}
</style>

function addTab(name){
  counter++;
  const id = 't'+counter;
  tabs[id] = {name: name||`${t('add').replace('Nieuw ','').replace('Neues ','').replace('Nouveau ','').replace('New ','')} ${counter}`, len:'',dep:'',lw:'yes',rw:'yes',dbl:'no',bw:115,bg:175,manualBg:false};
  const tab = document.createElement('div');
  tab.className = 'tab'+(active? '':' active');
  tab.id = id;
  tab.innerHTML = `${tabs[id].name} <span class="remove" data-id="${id}">×</span>`;
  tab.onclick = e => { if(!e.target.classList.contains('remove')) switchTab(id); };
  tab.querySelector('.remove').onclick = e => { e.stopPropagation(); removeTab(id); };
  document.getElementById('tabBar').appendChild(tab);
  document.getElementById('tabContents').insertAdjacentHTML('beforeend', createForm(id));
  bindInputs(id);
  if(!active) switchTab(id);
  else calc(id);
}

function switchTab(id){
  if(active){ document.getElementById(active)?.classList.remove('active'); document.getElementById('content-'+active).style.display='none'; }
  active=id;
  document.getElementById(id)?.classList.add('active');
  document.getElementById('content-'+id).style.display='block';
  calc(id);
}

function removeTab(id){
  if(Object.keys(tabs).length<=1) return;
  delete tabs[id];
  document.getElementById(id)?.remove();
  document.getElementById('content-'+id)?.remove();
  if(active===id){ const next=Object.keys(tabs)[0]; switchTab(next); }
}

function bindInputs(id){
  ['len','dep','lw','rw','dbl','bw','bg'].forEach(k=>{
    const el=document.getElementById(`${k==='len'?'len':k==='dep'?'dep':k==='lw'?'lw':k==='rw'?'rw':k==='dbl'?'dbl':k==='bw'?'bw':'bg'}-${id}`);
    if(!el) return;
    el.oninput = el.onchange = ()=>{
      if(k==='bg') tabs[id].manualBg=true;
      tabs[id][k]=el.value;
      // lengte/diepte: alleen via Bereken-knop
      if(k!=='len' && k!=='dep') calc(id);
    };
  });
  const btn=document.getElementById('calcbtn-'+id);
  if(btn) btn.onclick = ()=> calc(id);
}

function calc(id){
  const d=tabs[id];
  const len=parseFloat(document.getElementById('len-'+id).value);
  const dep=parseFloat(document.getElementById('dep-'+id).value);
  const bw=parseFloat(document.getElementById('bw-'+id).value);
  let bg=parseFloat(document.getElementById('bg-'+id).value);
  const lw=document.getElementById('lw-'+id).value;
  const rw=document.getElementById('rw-'+id).value;
  const dbl=document.getElementById('dbl-'+id).value==='yes';
  const res=document.getElementById('res-'+id);
  const diag=document.getElementById('diag-'+id);

  if(isNaN(len)||isNaN(dep)||len<=0||dep<=0){
    res.innerHTML='';
    const partsEl=document.getElementById('parts-'+id);
    if(partsEl) partsEl.innerHTML='';
    diag.innerHTML=`<p style="text-align:center;padding:24px;color:#64748b;font-size:1rem;">${t('invalid')}</p>`;
    return;
  }

  // auto beugel
  if(!d.manualBg){
    bg = beugelOpts.reduce((best,l)=>{
      const sp = dbl ? (dep-(2*l)-7)/2 : dep-(l+13);
      const bestSp = dbl ? (dep-(2*best)-7)/2 : dep-(best+13);
      return Math.abs(sp-25)<Math.abs(bestSp-25)?l:best;
    },beugelOpts[0]);
    document.getElementById('bg-'+id).value=bg;
  }

  const n = Math.floor(len/bw);
  const boxes = dbl ? n*2 : n;
  const postAdj = ((lw==='yes'||lw==='panel')&&(rw==='yes'||rw==='panel'))?-1:((lw==='no'&&rw==='no')?1:0);
  const posts = n + postAdj;
  const space = dbl ? (dep-(2*bg)-7)/2 : dep-(bg+13);
  const rem = len % bw;
  const remHalf = rem / 2;
  const endBoxW = bw + remHalf;
  const bestW = boxWidths.reduce((b,w)=> (len%w)<(len%b)?w:b ,boxWidths[0]);

  // Eindstuk schoftboom/kopboom per uiteinde
  // enkele: muur=2, paneel=1, box/beugel=1
  // dubbel: muur=1.5, paneel=1.5, box/beugel=0.5
  function endStuk(side){
    // enkele: muur=2, paneel=1, box=1
    // dubbel: muur=3, paneel=1, box=1  (per zijde)
    if(side==='yes') return dbl ? 3 : 2;
    if(side==='panel') return dbl ? 1 : 1;
    if(side==='no') return dbl ? 1 : 1;
    return 0;
  }
  const endW = endStuk(lw) + endStuk(rw);

  const parts = {
    posts, brackets: posts*(dbl?2:1), head: dbl?Math.max(0,Math.floor(boxes/2)-2):Math.max(0,boxes-2),
    endHead:2, wavy:boxes, couplers:posts*(dbl?2:1), endW,
    close: dbl?0:posts*2, anchors:posts*4, m12:posts*(dbl?10:8), m10:(posts*(dbl?2:1)*2)+(dbl?4:2),
    caps:posts, capB:posts*(dbl?2:1), u:posts*(dbl?2:1)*3, mattress:boxes, strip:boxes+1+(dbl?1:0),
    knee:Math.ceil(len/220)*(dbl?2:1), endP: ((lw==='panel'?1:0)+(rw==='panel'?1:0))*(dbl?2:1)
  };

  // Schematic – beugel length scales visually with selected bg
  const mattressLen = 183;
  const showN = Math.min(n, 8);
  const scale = 0.30;
  const mW = Math.max(bw * scale, 22);
  const endMW = Math.max(endBoxW * scale, 22); // 1e/laatste box visueel breder
  const mH = mattressLen * scale;
  // beugel visual height proportional to selected beugel length (bg in cm)
  const bH = Math.max(bg * scale * 0.85, 40);
  const gap = 10;
  const postSize = 9;
  const wallW = 11;
  const panelW = Math.round(wallW / 3);
  const mayo = '#0077C8';
  let g = '';

  function beugel(bx, yTop, yBot, squareY){
    return `<line x1="${bx}" y1="${yTop}" x2="${bx}" y2="${yBot}" stroke="${mayo}" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="${bx - postSize/2}" y="${squareY}" width="${postSize}" height="${postSize}" fill="#8b95a5" stroke="#5a6575" rx="1"/>`;
  }
  function wall(x, y, h){
    return `<rect x="${x}" y="${y}" width="${wallW}" height="${h}" fill="#8b95a5" stroke="#6b7280" rx="1"/>`;
  }
  function panel(x, y, h){
    return `<rect x="${x}" y="${y}" width="${panelW}" height="${h}" fill="#9ca3af" stroke="#6b7280" rx="3"/>`;
  }

  if(dbl){
    // double: each row height follows beugel length
    const rowH = Math.max(bH * 0.48, 36);
    const startY = 32;
    const midY = startY + rowH + 4;
    let x0 = 12;
    if(lw==='yes'){
      g += wall(x0, startY, rowH) + wall(x0, midY+4, rowH);
      x0 += wallW + 2;
    } else if(lw==='panel'){
      g += panel(x0, startY, rowH) + panel(x0, midY+4, rowH);
      x0 += panelW + 2;
    } else {
      g += beugel(x0 + postSize/2, startY, startY+rowH, midY - postSize/2);
      g += `<line x1="${x0 + postSize/2}" y1="${midY+4}" x2="${x0 + postSize/2}" y2="${midY+4+rowH}" stroke="${mayo}" stroke-width="2.5" stroke-linecap="round"/>`;
      x0 += postSize + 4;
    }
    let xCursor = x0;
    const widths = [];
    for(let i=0; i<showN; i++){
      const isEnd = (i===0 || i===showN-1) && remHalf > 0.05;
      const wi = isEnd ? endMW : mW;
      widths.push(wi);
      g += `<rect x="${xCursor}" y="${startY}" width="${wi}" height="${rowH}" fill="#1a1a1a" stroke="#333" stroke-width="1" rx="1"/>
            <rect x="${xCursor}" y="${midY+4}" width="${wi}" height="${rowH}" fill="#1a1a1a" stroke="#333" stroke-width="1" rx="1"/>`;
      if(i < showN - 1){
        const bx = xCursor + wi + gap/2;
        g += beugel(bx, startY, startY+rowH, midY - postSize/2);
        g += `<line x1="${bx}" y1="${midY+4}" x2="${bx}" y2="${midY+4+rowH}" stroke="${mayo}" stroke-width="2.5" stroke-linecap="round"/>`;
      }
      xCursor += wi + gap;
    }
    let endX = xCursor - gap;
    if(rw==='yes'){
      g += wall(endX + 2, startY, rowH) + wall(endX + 2, midY+4, rowH);
      endX += wallW + 4;
    } else if(rw==='panel'){
      g += panel(endX + 2, startY, rowH) + panel(endX + 2, midY+4, rowH);
      endX += panelW + 4;
    } else {
      const bx = endX + gap/2;
      g += beugel(bx, startY, startY+rowH, midY - postSize/2);
      g += `<line x1="${bx}" y1="${midY+4}" x2="${bx}" y2="${midY+4+rowH}" stroke="${mayo}" stroke-width="2.5" stroke-linecap="round"/>`;
      endX += gap + 4;
    }
    const totalW = endX + 16;
    // breedte boven elk matras
    let lx = x0;
    for(let i=0; i<showN; i++){
      const isEnd = (i===0 || i===showN-1) && remHalf > 0.05;
      const label = isEnd ? endBoxW.toFixed(1) : bw;
      const col = isEnd ? '#dc2626' : '#374151';
      g += `<text x="${lx + widths[i]/2}" y="${startY - 5}" text-anchor="middle" font-size="10" fill="${col}" font-weight="600">${label} cm</text>`;
      lx += widths[i] + gap;
    }
    g += `<text x="${totalW/2}" y="12" text-anchor="middle" font-size="11" font-weight="600" fill="${mayo}">${boxes} ${t('spacesLabel')}</text>`;
        diag.innerHTML = `<svg viewBox="0 0 ${totalW} ${midY+4+rowH+12}" width="100%" style="max-height:190px">${g}
      ${n>showN?`<text x="${endX+2}" y="${midY}" font-size="12" fill="#dc2626" font-weight="bold">+${n-showN}</text>`:''}
    </svg>`;
  } else {
    // single: blue line height = beugel length scale; mattress stays 183cm depth visual
    const topY = 36;
    // center the shorter/longer beugel line within mattress height
    const lineTop = topY + Math.max(0, (mH - bH) / 2);
    const lineBot = lineTop + bH;
    let x0 = 14;
    if(lw==='yes'){
      g += wall(x0, topY, mH);
      x0 += wallW + 2;
    } else if(lw==='panel'){
      g += panel(x0, topY, mH);
      x0 += panelW + 2;
    } else {
      g += beugel(x0 + postSize/2, lineTop, lineBot, topY);
      x0 += postSize + 4;
    }
    let xCursor = x0;
    const widths = [];
    for(let i=0; i<showN; i++){
      const isEnd = (i===0 || i===showN-1) && remHalf > 0.05;
      const wi = isEnd ? endMW : mW;
      widths.push(wi);
      g += `<rect x="${xCursor}" y="${topY}" width="${wi}" height="${mH}" fill="#1a1a1a" stroke="#333" stroke-width="1" rx="1"/>`;
      if(i < showN - 1){
        const bx = xCursor + wi + gap/2;
        g += beugel(bx, lineTop, lineBot, topY);
      }
      xCursor += wi + gap;
    }
    let endX = xCursor - gap;
    if(rw==='yes'){
      g += wall(endX + 2, topY, mH);
      endX += wallW + 4;
    } else if(rw==='panel'){
      g += panel(endX + 2, topY, mH);
      endX += panelW + 4;
    } else {
      const bx = endX + gap/2;
      g += beugel(bx, lineTop, lineBot, topY);
      endX += gap + 4;
    }
    const totalW = endX + 20;
    // breedte boven elk matras
    let lx = x0;
    for(let i=0; i<showN; i++){
      const isEnd = (i===0 || i===showN-1) && remHalf > 0.05;
      const label = isEnd ? endBoxW.toFixed(1) : bw;
      const col = isEnd ? '#dc2626' : '#374151';
      g += `<text x="${lx + widths[i]/2}" y="${topY - 5}" text-anchor="middle" font-size="10" fill="${col}" font-weight="600">${label} cm</text>`;
      lx += widths[i] + gap;
    }
    g += `<text x="${totalW/2}" y="13" text-anchor="middle" font-size="12" font-weight="600" fill="${mayo}">${boxes} ${t('spacesLabel')}</text>`;
        diag.innerHTML = `<svg viewBox="0 0 ${totalW} ${topY + mH + 10}" width="100%" style="max-height:210px">${g}
      ${n>showN?`<text x="${endX+4}" y="${topY + mH/2}" font-size="12" fill="#dc2626" font-weight="bold">+${n-showN}</text>`:''}
    </svg>`;
  }

  let html=`<h3>${t('result')}</h3>
    <p><b>${t('boxes')}:</b> ${boxes}</p>
    <p><b>${t('remaining')}:</b> ${rem.toFixed(1)} cm ${t('remDetail').replace('{v}', endBoxW.toFixed(1))}</p>
    <p><b>${t('space')}:</b> ${space.toFixed(1)} cm</p>`;
  if(space>35) html+=`<p class="advice">⚠️ ${t('adviceLong')}</p>`;
  if(space<15) html+=`<p class="advice">⚠️ ${t('adviceShort')}</p>`;
  if(bw!==bestW) html+=`<p class="suggestion">${t('suggest').replace('{v}',bestW)}</p>`;
  res.innerHTML=html;

  // parts list and everything after → under the visual
  const partsEl=document.getElementById('parts-'+id);
  let partsHtml=`<b>${t('parts')}</b><ul class="parts">`;
  const labels={posts:t('posts'),brackets:t('brackets'),head:t('head'),endHead:t('endHead'),wavy:t('wavy'),couplers:t('couplers'),endW:t('endW'),endHW:t('endHW'),close:t('close'),anchors:t('anchors'),m12:t('m12'),m10:t('m10'),caps:t('caps'),capB:t('capB'),u:t('u'),mattress:t('mattress'),strip:t('strip'),knee:t('knee'),endP:t('endP')};
  for(const [k,v] of Object.entries(parts)){
    if(k==='endP'&&lang!=='nl') continue;
    if(k==='endHW') continue;
    if(v>0) partsHtml+=`<li><b>${labels[k]||k}:</b> ${v}</li>`;
  }
  partsHtml+='</ul>';
  if(partsEl) partsEl.innerHTML=partsHtml;

  tabs[id].parts=parts; tabs[id].boxes=boxes; tabs[id].rem=rem; tabs[id].space=space;
}

function updateLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  document.getElementById('title').textContent=t('title');
  document.getElementById('addLabel').textContent=t('add');
  document.getElementById('contactTitle').textContent=t('contact');
  renderContact();
  // rebuild tabs
  const data=JSON.parse(JSON.stringify(tabs));
  document.getElementById('tabBar').innerHTML='';
  document.getElementById('tabContents').innerHTML='';
  tabs={}; counter=0; active=null;
  Object.values(data).forEach(d=>{
    addTab(d.name);
    const id='t'+counter;
    Object.assign(tabs[id],d);
    ['len','dep','lw','rw','dbl','bw','bg'].forEach(k=>{
      const el=document.getElementById((k==='len'?'len':k==='dep'?'dep':k==='lw'?'lw':k==='rw'?'rw':k==='dbl'?'dbl':k==='bw'?'bw':'bg')+'-'+id);
      if(el&&d[k]!==undefined) el.value=d[k];
    });
    calc(id);
  });
}

  document.getElementById('contactFields').innerHTML=`
    <div><label>${t('name')}</label><input id="c-name"></div>
    <div><label>${t('address')}</label><input id="c-addr"></div>
    <div><label>${t('postcode')}</label><input id="c-pc"></div>
    <div><label>${t('place')}</label><input id="c-place"></div>

      <div class="checkbox-row"><input type="checkbox" id="c-withMat"><label for="c-withMat">${t('withMat')}</label></div>
      <div class="checkbox-row"><input type="checkbox" id="c-withDeep"><label for="c-withDeep">${t('withDeep')}</label></div>
    </div>
    <div class="checkbox-row"><input type="checkbox" id="c-mat"><label for="c-mat">${t('matInterest')}</label></div>`;

    boxesCb.onchange = ()=>{
      sub.classList.toggle('show', boxesCb.checked);
      if(!boxesCb.checked){
        document.getElementById('c-withMat').checked = false;
        document.getElementById('c-withDeep').checked = false;
      }

  }

function getContact(){
  return {name:c('c-name'),addr:c('c-addr'),pc:c('c-pc'),place:c('c-place'),phone:c('c-phone'),email:c('c-email'),
    boxes:document.getElementById('c-boxes')?.checked,
    withMat:document.getElementById('c-withMat')?.checked,
    withDeep:document.getElementById('c-withDeep')?.checked,
    mat:document.getElementById('c-mat')?.checked};
  function c(id){return document.getElementById(id)?.value||'';}
}

function save(){
  localStorage.setItem('mayoCalc',JSON.stringify({tabs,contact:getContact(),lang}));
  toast(t('saved'));
}
function load(){
  const raw=localStorage.getItem('mayoCalc');
  if(!raw){toast(t('noData'));return;}
  const data=JSON.parse(raw);
  lang=data.lang||'nl';
  updateLang(lang);
  // restore values after rebuild
  setTimeout(()=>{
    Object.entries(data.tabs||{}).forEach(([oldId,d],i)=>{
      const id='t'+(i+1);
      if(tabs[id]){
        Object.assign(tabs[id],d);
        ['len','dep','lw','rw','dbl','bw','bg'].forEach(k=>{
          const el=document.getElementById((k==='len'?'len':k==='dep'?'dep':k==='lw'?'lw':k==='rw'?'rw':k==='dbl'?'dbl':k==='bw'?'bw':'bg')+'-'+id);
          if(el&&d[k]!==undefined) el.value=d[k];
        });
        calc(id);
      }
    });
    const c=data.contact||{};
    if(c.name) document.getElementById('c-name').value=c.name;
    if(c.addr) document.getElementById('c-addr').value=c.addr;
    if(c.pc) document.getElementById('c-pc').value=c.pc;
    if(c.place) document.getElementById('c-place').value=c.place;
    if(c.phone) document.getElementById('c-phone').value=c.phone;
    if(c.email) document.getElementById('c-email').value=c.email;
    if(c.boxes) document.getElementById('c-boxes').checked=true;
    if(c.mat) document.getElementById('c-mat').checked=true;
    toast(t('loaded'));
  },100);
}

function exportPdf(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  let y=15;
  doc.setFontSize(16); doc.text(t('title'),20,y); y+=10;
  Object.keys(tabs).forEach(id=>{
    const d=tabs[id];
    doc.setFontSize(12); doc.text(d.name,20,y); y+=7;
    doc.setFontSize(10);
    doc.text(`${t('boxes')}: ${d.boxes||'-'}  ${t('remaining')}: ${(d.rem||0).toFixed(1)} cm`,20,y); y+=6;
    if(d.parts){
      Object.entries(d.parts).forEach(([k,v])=>{

    }

  });
  const c=getContact();
  doc.text(`Contact: ${c.name} ${c.phone} ${c.email}`,20,y);
  doc.save('mayo-ligbox.pdf');
}

    const bg = document.getElementById('bg-'+id)?.value || d.bg;

    body += d.name + '\n' + '-'.repeat(30) + '\n';
    body += t('length') + ': ' + len + ' cm\n';
    body += t('depth') + ': ' + dep + ' cm\n';
    body += t('leftWall') + ': ' + (wallLabel[lw]||lw) + '\n';
    body += t('rightWall') + ': ' + (wallLabel[rw]||rw) + '\n';
    body += t('double') + ': ' + (dbl==='yes'?t('yes'):t('no')) + '\n';
    body += t('boxW') + ': ' + bw + ' cm\n';
    body += t('beugel') + ': ' + bg + ' cm\n\n';

    body += t('result') + ':\n';
    body += '  ' + t('boxes') + ': ' + (d.boxes ?? '-') + '\n';
    body += '  ' + t('remaining') + ': ' + (d.rem!=null ? Number(d.rem).toFixed(1)+' cm' : '-') + '\n';
    body += '  ' + t('space') + ': ' + (d.space!=null ? Number(d.space).toFixed(1)+' cm' : '-') + '\n\n';

    if(d.parts){
      body += t('parts') + ':\n';
      const labels={posts:t('posts'),brackets:t('brackets'),head:t('head'),endHead:t('endHead'),wavy:t('wavy'),couplers:t('couplers'),endW:t('endW'),close:t('close'),anchors:t('anchors'),m12:t('m12'),m10:t('m10'),caps:t('caps'),capB:t('capB'),u:t('u'),mattress:t('mattress'),strip:t('strip'),knee:t('knee'),endP:t('endP')};
      Object.entries(d.parts).forEach(([k,v])=>{
        if(k==='endHW') return;
        if(k==='endP'&&lang!=='nl') return;
        if(v>0) body += '  ' + (labels[k]||k) + ': ' + v + '\n';
      });
      body += '\n';
    }
  });

  body += '='.repeat(40) + '\n';
  body += t('contact') + ':\n';
  body += t('name') + ': ' + c.name + '\n';
  body += t('address') + ': ' + c.addr + '\n';
  body += t('postcode') + ': ' + c.pc + '\n';
  body += t('place') + ': ' + c.place + '\n';
  body += t('phone') + ': ' + c.phone + '\n';
  body += t('email') + ': ' + c.email + '\n';
  body += t('boxesInterest') + ': ' + (c.boxes?'Ja':'Nee') + '\n';
  if(c.boxes){
    body += '  ' + t('withMat') + ': ' + (c.withMat?'Ja':'Nee') + '\n';
    body += '  ' + t('withDeep') + ': ' + (c.withDeep?'Ja':'Nee') + '\n';
  }
  body += t('matInterest') + ': ' + (c.mat?'Ja':'Nee') + '\n';

  window.open('https://wa.me/31630569255?text=' + encodeURIComponent(body), '_blank');
}

// init
document.getElementById('addTab').onclick=()=>addTab();
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('mailBtn').onclick=sendMail;
document.getElementById('waBtn').onclick=sendWa;
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>updateLang(b.dataset.lang));
renderContact();
addTab();
</script>
</body>
